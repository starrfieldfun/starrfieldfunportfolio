<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc"><title id="title">PikStiq commerce system</title><desc id="desc">Three ordering paths, ready-made, print my design and custom design, converge into payment, production and delivery.</desc><rect width="1200" height="820" fill="#eae2d5"/><path d="M0 0H1200V820H0Z" fill="none" stroke="#d7cbbd" stroke-width="3"/><g font-family="Arial, sans-serif"><text x="64" y="75" fill="#5e4d69" font-size="17" font-weight="700" letter-spacing="3">PIKSTIQ / SYSTEM STUDY</text><text x="64" y="164" fill="#241d2c" font-size="72" font-weight="800" letter-spacing="-4">Ideas that stick.</text><text x="67" y="203" fill="#5e4d69" font-size="21">Three customer paths. One connected operation.</text><g transform="translate(64 250)"><rect width="345" height="252" rx="17" fill="#f9f5ed" stroke="#c5b8a8"/><rect x="25" y="23" width="65" height="65" rx="18" fill="#e9ddfa"/><g fill="#69419e"><rect x="39" y="37" width="15" height="15" rx="3"/><rect x="61" y="37" width="15" height="15" rx="3"/><rect x="39" y="59" width="15" height="15" rx="3"/><rect x="61" y="59" width="15" height="15" rx="3"/></g><text x="25" y="126" fill="#69419e" font-size="14" font-weight="700" letter-spacing="2">01 / CATALOGUE</text><text x="25" y="165" fill="#241d2c" font-size="29" font-weight="700">Ready-Made</text><text x="25" y="199" fill="#675b6c" font-size="17">Choose a pack or mix.</text><text x="25" y="225" fill="#675b6c" font-size="17">Select size and quantity.</text></g><g transform="translate(427 250)"><rect width="345" height="252" rx="17" fill="#f9f5ed" stroke="#c5b8a8"/><rect x="25" y="23" width="65" height="65" rx="18" fill="#e9ddfa"/><path d="M45 36h18l12 12v25H41V36zM63 36v13h12M49 60h17M49 67h17" fill="none" stroke="#69419e" stroke-width="3" stroke-linejoin="round"/><text x="25" y="126" fill="#69419e" font-size="14" font-weight="700" letter-spacing="2">02 / PRINT</text><text x="25" y="165" fill="#241d2c" font-size="29" font-weight="700">Print My Design</text><text x="25" y="199" fill="#675b6c" font-size="17">Upload finished artwork.</text><text x="25" y="225" fill="#675b6c" font-size="17">No illustration needed.</text></g><g transform="translate(790 250)"><rect width="345" height="252" rx="17" fill="#f9f5ed" stroke="#c5b8a8"/><rect x="25" y="23" width="65" height="65" rx="18" fill="#e9ddfa"/><path d="M57 34l5 17 17 5-17 5-5 17-5-17-17-5 17-5z" fill="#69419e"/><text x="25" y="126" fill="#69419e" font-size="14" font-weight="700" letter-spacing="2">03 / CREATE</text><text x="25" y="165" fill="#241d2c" font-size="29" font-weight="700">Custom Design</text><text x="25" y="199" fill="#675b6c" font-size="17">Share a photo and style.</text><text x="25" y="225" fill="#675b6c" font-size="17">Approve the new artwork.</text></g><g stroke="#967cad" stroke-width="2.5" fill="none"><path d="M237 502v40h363v34M600 502v74M963 502v40H600"/><path d="M593 569l7 8 7-8"/></g><rect x="64" y="586" width="1071" height="160" rx="17" fill="#261e30"/><text x="93" y="624" fill="#d3b6f4" font-size="15" font-weight="700" letter-spacing="2">THE OPERATING SYSTEM</text><text x="93" y="674" fill="#fffaf3" font-size="29" font-weight="700">PAYMENT</text><text x="344" y="674" fill="#d3b6f4" font-size="28">→</text><text x="390" y="674" fill="#fffaf3" font-size="29" font-weight="700">PRODUCTION</text><text x="674" y="674" fill="#d3b6f4" font-size="28">→</text><text x="720" y="674" fill="#fffaf3" font-size="29" font-weight="700">DELIVERY</text><text x="93" y="712" fill="#cbbdd4" font-size="17">Orders, artwork, fulfilment and customer updates.</text><text x="64" y="785" fill="#695b70" font-size="13" font-weight="700" letter-spacing="1.8">EDITORIAL WORKFLOW ILLUSTRATION / NOT A LIVE SCREEN</text></g></svg>